[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resolve-runtime-calculator"
version = "0.9.0"
description = "Runtime calculator for Davinci Resolve"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Michael Jordan", email = "michael@glowingpixel.com" }
]
dependencies = [
    "resolve-common @ git+https://github.com/mjiggidy/resolve_common.git@v0.2",
    "timecode @ git+https://github.com/mjiggidy/timecode.git@v1.0.0",
    "resolve-ui-mediapool-input @ git+https://github.com/mjiggidy/resolve-ui-mediapool-input.git@v0.1",
    "resolve-ui-timecode-input @ git+https://github.com/mjiggidy/resolve-ui-timecode-input.git@v0.1",
]

[tool.setuptools.packages.find]
where = ["src"]